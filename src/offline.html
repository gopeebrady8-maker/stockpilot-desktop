<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Holdbay</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; background: #f4f5f7; color: #111827; }
  @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #e5e7eb; } .card { background: #171a21 !important; border-color: #262b36 !important; } }
  .card { text-align: center; max-width: 420px; padding: 36px 32px; background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 8px; } p { color: #6b7280; line-height: 1.5; margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; background: #16a34a; color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer; }
  button:hover { background: #15803d; } small { display: block; margin-top: 18px; color: #9ca3af; }
</style></head>
<body><div class="card">
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#16a34a"/><path d="M8 21.5 16 25l8-3.5v-9L16 9l-8 3.5z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M8 12.5 16 16l8-3.5M16 16v9" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
  <h1>Can’t reach Holdbay</h1>
  <p>Check your internet connection, then try again. Your data is safe: it’s stored online, not on this computer.</p>
  <button id="retry">Try again</button>
  <small>Holdbay by BT Design</small>
</div>
<script>
  const target = new URLSearchParams(location.search).get('url');
  const go = () => window.stockpilotDesktop && window.stockpilotDesktop.retry(target);
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script></body></html>
